[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "folio-docs"
version = "0.3.0"
description = "A modern Python documentation generator. Sphinx alternative using Nextra + shadcn."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "pguijas" },
]
keywords = [
    "documentation",
    "docs",
    "nextra",
    "python",
    "static-site-generator",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.15.0",
    "docstring-parser>=0.16",
    "pluggy>=1.5.0",
    "pyyaml>=6.0",
    "readchar>=4.0.0",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
    "watchfiles>=1.0",
]

[project.urls]
Homepage = "https://github.com/pguijas/folio"
Documentation = "https://pguijas.github.io/folio/"
Issues = "https://github.com/pguijas/folio/issues"
Source = "https://github.com/pguijas/folio"

[project.scripts]
folio = "folio_docs.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
    "tomli>=2.0; python_version < '3.11'",
]

[tool.hatch.build.targets.wheel]
packages = ["folio_docs"]

[tool.hatch.build.targets.sdist]
only-include = [
    "/assets",
    "/docs",
    "/folio_docs",
    "/scripts",
    "/tests",
    "/template/.prettierignore",
    "/template/.prettierrc",
    "/template/app",
    "/template/components",
    "/template/components.json",
    "/template/content",
    "/template/eslint.config.mjs",
    "/template/hooks",
    "/template/lib",
    "/template/mdx-components.tsx",
    "/template/next-env.d.ts",
    "/template/next.config.mjs",
    "/template/package.json",
    "/template/pnpm-lock.yaml",
    "/template/pnpm-workspace.yaml",
    "/template/postcss.config.mjs",
    "/template/public",
    "/template/template-globals.d.ts",
    "/template/theme",
    "/template/tsconfig.json",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/THIRD-PARTY-NOTICES.md",
    "/install.sh",
    "/pyproject.toml",
    "/uv.lock",
]
exclude = [
    "/.build",
    "/.next",
    "/_site",
    "/dist",
    "/node_modules",
    "/template/.next",
    "/template/node_modules",
]

[tool.hatch.build.targets.wheel.force-include]
"template/.prettierignore" = "folio_docs/template/.prettierignore"
"template/.prettierrc" = "folio_docs/template/.prettierrc"
"template/app" = "folio_docs/template/app"
"template/components" = "folio_docs/template/components"
"template/components.json" = "folio_docs/template/components.json"
"template/content" = "folio_docs/template/content"
"template/eslint.config.mjs" = "folio_docs/template/eslint.config.mjs"
"template/hooks" = "folio_docs/template/hooks"
"template/lib" = "folio_docs/template/lib"
"template/mdx-components.tsx" = "folio_docs/template/mdx-components.tsx"
"template/next-env.d.ts" = "folio_docs/template/next-env.d.ts"
"template/next.config.mjs" = "folio_docs/template/next.config.mjs"
"template/package.json" = "folio_docs/template/package.json"
"template/pnpm-lock.yaml" = "folio_docs/template/pnpm-lock.yaml"
"template/pnpm-workspace.yaml" = "folio_docs/template/pnpm-workspace.yaml"
"template/postcss.config.mjs" = "folio_docs/template/postcss.config.mjs"
"template/public" = "folio_docs/template/public"
"template/template-globals.d.ts" = "folio_docs/template/template-globals.d.ts"
"template/theme" = "folio_docs/template/theme"
"template/tsconfig.json" = "folio_docs/template/tsconfig.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
