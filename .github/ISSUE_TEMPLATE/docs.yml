name: Documentation issue
description: Report unclear, missing, or incorrect documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: textarea
    id: page
    attributes:
      label: Page or section
      description: Link or name the affected documentation.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What should change?
      description: Describe the confusion, missing detail, or correction.
    validations:
      required: true
