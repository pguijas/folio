name: Release

"on":
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: template/pnpm-lock.yaml

      - name: Install project dependencies
        run: uv sync --all-groups --locked

      - name: Check release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: uv run --locked python scripts/check_release_version.py

      - name: Lint Python
        run: uv run --locked ruff check .

      - name: Run Python tests
        run: uv run --locked pytest

      - name: Build generated docs site
        run: uv run --locked folio build --clean

      - name: Clear old distributions
        run: rm -rf dist

      - name: Build distributions
        run: uv build

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*
