name: Release Folio Docs

"on":
  push:
    tags: ["docs-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, nas]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: folio-docs/template/pnpm-lock.yaml

      - name: Install project dependencies
        run: uv sync --all-groups --locked

      - name: Check release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: uv run --locked python folio-docs/scripts/check_release_version.py

      - name: Lint Python
        run: uv run --locked ruff check folio-docs

      - name: Run Python tests
        run: uv run --locked pytest folio-docs/tests

      - name: Build generated docs site
        run: uv run --locked folio build --clean

      - name: Clear old distributions
        run: rm -rf dist

      - name: Build distributions
        run: uv build --project folio-docs --out-dir dist/docs

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: folio-docs-distributions
          path: dist/docs/*

  publish:
    needs: build
    runs-on: [self-hosted, nas]
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: folio-docs-distributions
          path: dist

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*
