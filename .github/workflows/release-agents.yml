name: Release Folio for Agents

"on":
  push:
    tags: ["agents-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, nas]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
      - name: Install project dependencies
        run: uv sync --all-groups --locked
      - name: Check release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: uv run --locked python folio-agents/scripts/check_release_version.py
      - name: Lint Folio for Agents
        run: uv run --locked ruff check folio-agents
      - name: Run Folio for Agents tests
        run: uv run --locked pytest folio-agents/tests
      - name: Build distributions
        run: uv build --project folio-agents --out-dir dist/agents
      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: folio-agents-distributions
          path: dist/agents/*

  publish:
    needs: build
    runs-on: [self-hosted, nas]
    environment: pypi-agents
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: folio-agents-distributions
          path: dist
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*
