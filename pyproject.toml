[project]
name = "folio-products"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
    "folio-docs",
    "folio-agents",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["folio-docs", "folio-agents"]

[tool.uv.sources]
folio-docs = { workspace = true }
folio-agents = { workspace = true }

[dependency-groups]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "folio-docs/tests", "folio-agents/tests"]
pythonpath = ["folio-docs", "folio-agents"]
